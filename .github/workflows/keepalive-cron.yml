name: External Keep-Alive & Auto-Publisher Cron

on:
  schedule:
    # Runs every 15 minutes to guarantee Render is always awake and publishing
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /cron/publish
        run: |
          curl -s -f -m 30 "https://insta-agent-ekqb.onrender.com/cron/publish" || true
      - name: Ping Render /cron/create (Queue top-up)
        run: |
          curl -s -f -m 30 "https://insta-agent-ekqb.onrender.com/cron/create" || true
